name: release

# Cut a release whenever a vX.Y.Z tag is pushed. The matrix builds MSI on
# Windows and AppImage on Linux, signs the updater payloads with the keypair
# stored in repo secrets, and uploads everything to a fresh GitHub Release
# named after the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "Apocrypha ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: |
            See the changelog at https://github.com/VitorTaichou/apocrypha/compare/${{ github.event.before }}...${{ github.ref_name || github.event.inputs.tag }}

            ## Downloads

            - **Windows:** the `.msi` installer attached below
            - **Linux / Steam Deck:** the `.AppImage`, `chmod +x` and run

            ## Heads-up

            Windows build is not code-signed yet — first launch will trigger
            SmartScreen's "Windows protected your PC" dialog. Click **More info**
            → **Run anyway** the first time; after that Windows trusts it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
