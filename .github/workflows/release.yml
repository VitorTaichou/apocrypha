name: release

# Cut a release whenever a vX.Y.Z tag is pushed. The matrix builds MSI on
# Windows and AppImage on Linux, signs the updater payloads with the keypair
# stored in repo secrets, and uploads everything to a fresh GitHub Release
# named after the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so the changelog step can diff against
          # the previous release tag.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Compute release notes
        id: notes
        shell: bash
        run: |
          git fetch --tags --force --quiet
          CURRENT="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          PREV=$(git tag --sort=-creatordate | grep -v "^${CURRENT}$" | head -1)
          if [ -n "$PREV" ]; then
            CHANGES=$(git log "${PREV}..${CURRENT}" --pretty=format:"- %s" --no-merges)
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV}...${CURRENT}"
          else
            CHANGES=$(git log "${CURRENT}" --pretty=format:"- %s" --no-merges -10)
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${CURRENT}"
          fi
          {
            echo 'BODY<<EOF_BODY'
            echo "Apocrypha ${CURRENT} — modern addon manager for The Elder Scrolls Online."
            echo ""
            echo "Highlights"
            echo ""
            echo "${CHANGES}"
            echo ""
            echo "Downloads"
            echo ""
            echo "- Windows: the .msi installer attached below"
            echo "- Linux / Steam Deck: the .AppImage (chmod +x and run)"
            echo "- Also available: .deb, .rpm, NSIS .exe — all signed for the in-app updater"
            echo ""
            echo "Heads-up for Windows"
            echo ""
            echo "The build is not code-signed yet, so first launch shows the SmartScreen"
            echo 'dialog ("Windows protected your PC"). Click More info > Run anyway once;'
            echo "Windows trusts it from then on."
            echo ""
            echo "Full changelog: ${COMPARE_URL}"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name || github.event.inputs.tag }}
          releaseName: "Apocrypha ${{ github.ref_name || github.event.inputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
