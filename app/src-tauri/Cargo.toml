[package]
name = "apocrypha"
version = "0.1.2"
description = "Modern addon manager for The Elder Scrolls Online"
authors = ["Vitor Danrley"]
edition = "2021"

[lib]
name = "apocrypha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
